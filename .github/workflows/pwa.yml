name: Build and Publish PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pwa-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Validate Expo
        run: npm run validate

      - name: Export PWA
        run: npm run build:web

      - name: Publish dist to gh-pages
        run: |
          mkdir -p /tmp/750-lab-dist
          cp -R dist/. /tmp/750-lab-dist/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git switch gh-pages
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R /tmp/750-lab-dist/. .
          touch .nojekyll
          git add -A
          git commit -m "deploy: publish PWA from ${GITHUB_SHA}" || exit 0
          git push origin gh-pages

      - name: Smoke test live CCAR-F page
        shell: bash
        run: |
          set -euo pipefail
          CLEAN_URL="https://antuy154.github.io/toeic_750/ccar-vocabulary/?build=${GITHUB_SHA}"
          LEGACY_URL="https://antuy154.github.io/toeic_750/ccar-vocabulary.html?build=${GITHUB_SHA}"

          echo "Waiting for GitHub Pages to serve the new clean route..."
          for attempt in $(seq 1 30); do
            clean_body="$(curl -fsSL --max-time 15 "$CLEAN_URL" 2>/dev/null || true)"
            legacy_body="$(curl -fsSL --max-time 15 "$LEGACY_URL" 2>/dev/null || true)"

            if printf '%s' "$clean_body" | grep -q "Claude Architecture Glossary" \
              && printf '%s' "$clean_body" | grep -q "stop_reason" \
              && printf '%s' "$legacy_body" | grep -q "window.history.replaceState"; then
              echo "Live smoke test passed on attempt $attempt."
              exit 0
            fi

            echo "Attempt $attempt: deployment not ready yet."
            sleep 5
          done

          echo "Live smoke test failed after 30 attempts."
          exit 1
