name: Build and Publish PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pwa-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Validate Expo
        run: npm run validate

      - name: Export PWA
        run: npm run build:web

      - name: Publish dist to gh-pages
        run: |
          mkdir -p /tmp/750-lab-dist
          cp -R dist/. /tmp/750-lab-dist/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git switch gh-pages
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R /tmp/750-lab-dist/. .
          touch .nojekyll
          git add -A
          git commit -m "deploy: publish PWA from ${GITHUB_SHA}" || exit 0
          git push origin gh-pages

      - name: Smoke test live CCAR-F page
        shell: bash
        run: |
          set -euo pipefail
          CLEAN_URL="https://antuy154.github.io/toeic_750/ccar-vocabulary/?build=${GITHUB_SHA}"
          LEGACY_URL="https://antuy154.github.io/toeic_750/ccar-vocabulary.html?build=${GITHUB_SHA}"
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"

          if [[ -z "$BROWSER" ]]; then
            echo "No headless Chromium/Chrome binary available on runner."
            exit 1
          fi

          echo "Using browser: $BROWSER"
          echo "Waiting for GitHub Pages and testing real browser hydration..."

          for attempt in $(seq 1 30); do
            clean_body="$(curl -fsSL --max-time 15 "$CLEAN_URL" 2>/dev/null || true)"
            legacy_body="$(curl -fsSL --max-time 15 "$LEGACY_URL" 2>/dev/null || true)"

            static_ready=false
            if [[ "$clean_body" == *"Claude Architecture Glossary"* ]] \
              && [[ "$clean_body" == *"stop_reason"* ]] \
              && [[ "$legacy_body" == *"window.history.replaceState"* ]]; then
              static_ready=true
            fi

            if [[ "$static_ready" == true ]]; then
              clean_dom="$("$BROWSER" --headless --no-sandbox --disable-gpu --virtual-time-budget=5000 --dump-dom "$CLEAN_URL" 2>/dev/null || true)"
              legacy_dom="$("$BROWSER" --headless --no-sandbox --disable-gpu --virtual-time-budget=5000 --dump-dom "$LEGACY_URL" 2>/dev/null || true)"

              if [[ "$clean_dom" == *"Claude Architecture Glossary"* ]] \
                && [[ "$clean_dom" != *"Unmatched Route"* ]] \
                && [[ "$legacy_dom" == *"Claude Architecture Glossary"* ]] \
                && [[ "$legacy_dom" != *"Unmatched Route"* ]]; then
                echo "Live browser smoke test passed on attempt $attempt."
                exit 0
              fi

              echo "Attempt $attempt: static files ready, browser hydration not ready."
            else
              echo "Attempt $attempt: deployment not ready yet."
            fi

            sleep 5
          done

          echo "Live browser smoke test failed after 30 attempts."
          exit 1
